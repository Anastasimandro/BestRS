name: Android

# Task 00's toolchain gate: one workflow that turns the Rust cdylib into a debug APK.
# The desktop jobs in tests.yml and release.yml are deliberately untouched.
on:
  pull_request:
    paths: ["src/**", "android/**", "ui/android/**", "assets/**", "locales/**",
            "Cargo.toml", "Cargo.lock", "build.rs", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: android-actions/setup-android@v3

      - name: NDK and SDK
        run: |
          sdkmanager "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.1.0"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Ninja for Skia
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: taiki-e/install-action@cargo-ndk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Rust -> jniLibs
        working-directory: android
        run: cargo ndk -p 26 -t arm64-v8a -t x86_64 -o app/src/main/jniLibs build --lib --locked

      - name: Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk bestrs-android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bestrs-android-debug
          path: bestrs-android-debug.apk
          if-no-files-found: error
